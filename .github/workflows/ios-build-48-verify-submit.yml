name: Verify and submit iPhone build 48
on:
  push:
    branches: [release/ios-1.0.19-build-48]
    paths: [.github/workflows/ios-build-48-verify-submit.yml]
permissions:
  contents: read
concurrency:
  group: psychotechniplus-submit-build-48
  cancel-in-progress: false
jobs:
  verify-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_ID: ab5baae0-16fb-4611-89ea-b3dd3f79c9d2
      SOURCE_SHA: 1c311dfa3f809eb88c51726a1203fbb43bc047c9
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 1c311dfa3f809eb88c51726a1203fbb43bc047c9
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 20.2.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install Expo project dependencies
        run: npm ci --no-audit --no-fund
      - name: Diagnose the failed iOS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas build:view "$BUILD_ID" --json >"$RUNNER_TEMP/eas48.json" 2>"$RUNNER_TEMP/eas48.stderr"
          python - "$RUNNER_TEMP/eas48.json" <<'PY'
          import json, re, sys, urllib.request
          j=json.load(open(sys.argv[1]))
          assert j['status']=='ERRORED'
          def scrub(s):
              s=re.sub(r'https?://[^\s\'"]+', '[URL omitted]', s)
              s=re.sub(r'/Users/[^/\s]+', '/Users/[name]', s)
              s=re.sub(r'[A-Za-z0-9_-]{42,}', '[long value omitted]', s)
              return s[:550]
          error=j.get('error') or {}
          print('Expo error:',scrub(f"{error.get('errorCode','')}: {error.get('message','')}"))
          urls=[(j.get('artifacts') or {}).get('xcodeBuildLogsUrl'), *reversed(j.get('logFiles') or [])][:5]
          match=re.compile(r'(?i)(?:fatal error:|\berror:|\[!\]|No profiles for|SDK version issue|Provisioning profile.+expired|Xcode version|deployment target.+not supported|Error building iOS application)')
          sensitive=re.compile(r'(?i)\b(?:password|bearer|token|secret|authorization|private.key|api.key|BEGIN CERTIFICATE)\b')
          picked=[]
          for url in filter(None,urls):
              try:
                  with urllib.request.urlopen(url,timeout=15) as resp:
                      raw=resp.read(8_000_000).decode('utf-8','replace')
              except Exception:
                  continue
              for line in raw.splitlines():
                  if match.search(line) and not sensitive.search(line):
                      v=scrub(line.strip())
                      if v not in picked: picked.append(v)
          for v in picked[-24:]: print(v)
          PY
