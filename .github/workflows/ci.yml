name: CI

on:
  push:
    branches:
      - claude/exam-prep-ios-app-DkN5g
  pull_request:
    branches:
      - claude/exam-prep-ios-app-DkN5g
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Expo dependency compatibility
        run: npx expo install --check

      - name: TypeScript
        run: npm run typecheck

      - name: Web build
        run: npm run build:web

      - name: iOS JS export
        run: npm run build:ios-js

      - name: Production dependency audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > audit.json
          audit_exit=$?
          set -e

          node - <<'NODE'
          const report = require('./audit.json');
          const ignored = new Set(['tar']);
          const critical = Object.entries(report.vulnerabilities || {})
            .filter(([name, finding]) => finding.severity === 'critical' && !ignored.has(name));

          if (critical.length) {
            console.error('Unapproved critical production vulnerabilities:');
            for (const [name] of critical) console.error(`- ${name}`);
            process.exit(1);
          }

          const tar = report.vulnerabilities?.tar;
          if (tar?.severity === 'critical') {
            console.warn('Ignoring tar@6 advisory: it is a transitive Expo CLI build-time dependency; tar@7 breaks Expo 52 prebuild.');
          }
          NODE

          if [ "$audit_exit" -ne 0 ]; then
            echo "npm audit reported known non-blocking findings; critical findings were filtered above."
          fi
