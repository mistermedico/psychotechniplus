name: CI

on:
  push:
    branches:
      - claude/exam-prep-ios-app-DkN5g
  pull_request:
    branches:
      - claude/exam-prep-ios-app-DkN5g
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Web build
        run: npm run build:web
